# Author: M. El Aabaribaoune (@um6p)
[Experiment]
# Simulation start date (Format: YYYY-MM-DD)
StartDate = 2015-01-01

# Simulation end date (Format: YYYY-MM-DD). The chain will stop when it reaches this date.
EndDate   = 2016-01-01

# Length of a single simulation chunk
PeriodLength = 1Y

# Initialization mode for the VERY FIRST period defined by StartDate.
InitMode = restart

# Experiment name 
ExperimentName = ens_opl_2015

# Path to the base LIS configuration template
TemplateFile = templates/lis_ens_opl.config.template
