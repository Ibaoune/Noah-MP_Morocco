# Author: M. El Aabaribaoune (@um6p)
[Experiment]
# Simulation start date (Format: YYYY-MM-DD)
StartDate = 2008-01-01

# Simulation end date (Format: YYYY-MM-DD). The chain will stop when it reaches this date.
EndDate   = 2016-01-01

# Length of a single simulation chunk
# Valid options: 1Y (1 Year), 1M (1 Month), 1D (1 Day)
PeriodLength = 1Y

# Initialization mode for the VERY FIRST period defined by StartDate.
# Options: 'coldstart' or 'restart'. 
# Note: All subsequent periods will automatically use 'restart'.
InitMode = restart

# Experiment name (used for naming log files, output directories, and SLURM jobs)
ExperimentName = spinup

# Path to the base LIS configuration template
TemplateFile = templates/lis_spinup.config.template
