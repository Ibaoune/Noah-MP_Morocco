options:
  run_mode: "real_data" # "synthetic_test" | "real_data_smoke_test" | "real_data"
  start_date: "2016-01-01"
  end_date: "2020-12-31"
  use_insitu_precipitation: false
  use_shap_full: false
  use_shap_sample: true
  shap_sample_size: 5000
  
  # Temporal validation
  train_years: [2016, 2017, 2018, 2019]
  test_years: [2020]
  
  # Predictor mode: assimilation_mechanics OR environmental_explanatory
  # - assimilation_mechanics: can include innovation
  # - environmental_explanatory: must exclude innovation
  predictor_mode: "environmental_explanatory"
  
  use_shap: true

