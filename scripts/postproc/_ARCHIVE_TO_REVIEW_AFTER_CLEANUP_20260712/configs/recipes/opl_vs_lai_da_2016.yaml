# ============================================================
# RECETTE : OPL vs DA-LAI (2016)
# ============================================================
recipe_id: opl_vs_lai_da_2016
title: "OPL vs LAI data assimilation (2016)"
description: >
  Compare l'Open Loop avec l'expérience d'assimilation du LAI.
  Évalue l'impact de l'assimilation LAI sur la végétation, les flux et le bilan hydrique.
  NOTE : Expérience DA-LAI non encore disponible (path: null dans experiments.yaml).
year: 2016
domain: morocco_001deg
comparison_mode: two_experiment
baseline: OPL_noirr_2016

experiments:
  - OPL_noirr_2016
  - DA_lai_noirr_2016

variables:
  - surface_soil_moisture
  - rootzone_soil_moisture
  - evapotranspiration
  - transpiration
  - lai
  - total_runoff
  - groundwater_storage

diagnostics:
  assimilation:
    enabled: true
    active_diagnostics:
      - coverage
      - innovations
    da_experiments:
      - DA_lai_noirr_2016
    seasons:
      wet_season: [12, 1, 2]
      dry_season: [6, 7, 8]

  maps:
    enabled: true
    figure_types:
      - annual_mean
      - difference_against_baseline

  timeseries:
    enabled: true
    spatial_average: domain

  runoff_partitioning:
    enabled: true
  water_balance:
    enabled: true
  streamflow:
    enabled: false
  external_validation:
    enabled: false
  spatial_analysis:
    enabled: false
  synthesis:
    enabled: false

outputs:
  figure_dir: "outputs/matrix_2016/figures/opl_vs_lai_da/"
  metrics_dir: "outputs/matrix_2016/metrics/opl_vs_lai_da/"
  table_dir: "outputs/matrix_2016/tables/opl_vs_lai_da/"
  pdf_report: "outputs/matrix_2016/pdf/opl_vs_lai_da_2016.pdf"
