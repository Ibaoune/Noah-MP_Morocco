  gmia: "data/land_params/GMIA/gmia_v5_aei_pct.asc"
  wapor: "data/observations/WaPOR"
  fluxsat: "data/observations/FLUXSAT"
  gldas: "data/validation/lsm/GLDAS"
  streamflow: "data/validation/streamflow"
