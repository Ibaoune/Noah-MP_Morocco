# Domain boundaries (North Morocco Basin)
domain:
  lon_min: -10.0
  lon_max: -1.0
  lat_min: 30.0
  lat_max: 36.0

# Execution toggles
run_modes:
  - id: "matrix_2016"
    active: true
    start_date: "2016-01-01"
    end_date: "2016-12-31"
