  ascat: "data/validation/soil_moisture/ASCAT/raw"
  modis_lai: "data/observations_archive/MODIS_LAI/processed"

# Enable/Disable specific plots
active_plots:
  time_series: true
  spatial_maps: true
  ecosystem_stats: true
  streamflow: true
  gldas: true
  extremes: true
