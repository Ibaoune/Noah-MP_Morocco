    main_fontsize: 13
    subtitle_fontsize: 10
    main_fontweight: "bold"

  colorbar_mode: "independent_physical"

  colormap:
    name: "YlOrBr"
    discrete: true
    bad_color: "lightgrey"
    background_color: "0.92"

  forecast_colorbar:
    label: "Forecast uncertainty (×10⁻³ m³ m⁻³)"
    bounds: [0, 10, 20, 30, 40, 50, 60, 70]
