# ==========================================
# CONFIGURATION: ASSIMILATION DIAGNOSTICS
# ==========================================

# 1. Project Global Paths
# Provide absolute paths or paths relative to the execution directory
project_root: "/home/mohammad.elaabaribao/lustre/empowermed-ahl6xm8o7mg/users/mohammad.elaabaribao/NoahMP_Morocco"
output_dir: "scripts/postproc/figures/matrix_2016/assimilation_diagnostics"

# 2. Experiment Settings
experiment_name: "DA_nocdf_noirr_2016"
# Paths to the Open Loop (OPL) and Data Assimilation (DA) experiments
opl_dir: "experiments/NorthMor/matrix_2016/OPL_noirr_2016/output"
da_dir: "experiments/NorthMor/matrix_2016/DA_nocdf_noirr_2016/output"

# 3. Period of Analysis
start_date: "2016-01-01"
end_date: "2016-12-31"

# Seasonal Definitions (used for seasonal increment splitting)
# Numbers correspond to months (e.g., 12=Dec, 1=Jan, 2=Feb)
seasons:
  wet_season: [12, 1, 2] # DJF
  dry_season: [6, 7, 8]  # JJA

# 4. Active Diagnostics
# List the diagnostics you want to execute.
# These match the python module names in the 'diagnostics/' folder.
active_diagnostics:
  # - "coverage"
  # - "innovations"
  # - "seasonal_increments"
  - "spread"

assimilation_observations_map:
  enabled: true

  output:
    filename: "Fig01_smap_assimilated_observation_count_DA-noCDF-noIRR_2016.png"
    dpi: 300
    bbox_inches: "tight"

  title:
    main: "Assimilated SMAP observations in 2016"
