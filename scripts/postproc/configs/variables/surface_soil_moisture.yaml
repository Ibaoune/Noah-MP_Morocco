variable_id: surface_soil_moisture
long_name: Surface soil moisture
short_name: SSM
unit: m3/m3
category: soil_moisture

input:
  source: LIS
  lis_variable_names:
    - SoilMoist_tavg
  operation: extract_layer
  layer: 1
  target_depth: 0.10

aggregation:
  temporal:
    - daily
    - monthly
    - annual_mean
  spatial:
    - map
    - domain_mean

plotting:
  cmap: "YlGnBu"
  difference_cmap: "RdBu"
  vmin: 0.05
  vmax: 0.25
  levels: [0.05, 0.075, 0.10, 0.125, 0.15, 0.175, 0.20, 0.225, 0.25]
  difference_vmin: -0.03
  difference_vmax: 0.03
  difference_levels: [-0.03, -0.02, -0.01, 0, 0.01, 0.02, 0.03]
  colorbar_label: "Surface soil moisture (m³ m⁻³)"
  difference_label: "Δ surface soil moisture (m³ m⁻³)"
  unit_label: "m³ m⁻³"
  tick_format: "%.3f"
  y_min: 0.06
  y_max: 0.30
  auto_limits: false
  center_difference_on_zero: true
