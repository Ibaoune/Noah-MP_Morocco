# Author: M. EL Aabaribaoune (@um6p)

dataset_id: grace
display_name: GRACE TWS Anomalies
version: unknown
validation_category: water_storage
validation_role: INDEPENDENT_OBSERVATION
independence_level: STRICT
paths:
  raw: data/validation/water_storage/GRACE_GRACEFO/raw
  processed: data/validation/water_storage/GRACE/processed
files:
  pattern: '*.nc'
variables:
  observation: lwe_thickness
  lis: TWS_tavg
coordinates:
  time: time
  latitude: lat
  longitude: lon
units:
  native: cm
  target: cm
  scale_factor: 1.0
  offset: 0.0
missing_values:
  fill_value: -9999.0
  valid_min: null
  valid_max: null
temporal:
  native_frequency: daily
  target_frequency: daily
  interval_definition: mean
spatial:
  native_resolution: 0.25 deg
  target_strategy: aggregate_lis_to_obs
  resampling_method: conservative
period:
  start: '2015-01-01'
  end: '2020-12-31'
quality_control:
  minimum_valid_pairs: 30
  minimum_valid_fraction: 0.5
enabled: true
