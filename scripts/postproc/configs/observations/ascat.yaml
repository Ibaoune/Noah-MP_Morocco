dataset_id: ascat
display_name: ASCAT Soil Moisture
version: unknown
validation_category: soil_moisture
validation_role: INDEPENDENT_REMOTE_SENSING
independence_level: STRICT
paths:
  raw: data/validation/soil_moisture/ASCAT/raw
  processed: data/validation/soil_moisture/ASCAT/processed
files:
  pattern: '*_nc'
variables:
  observation: sm
  lis: SoilMoist_tavg
coordinates:
  time: time
  latitude: lat
  longitude: lon
units:
  native: degree_of_saturation
  target: degree_of_saturation
  scale_factor: 1.0
  offset: 0.0
missing_values:
  fill_value: -9999.0
  valid_min: null
  valid_max: null
temporal:
  native_frequency: daily
  target_frequency: daily
  interval_definition: mean
spatial:
  native_resolution: 0.25 deg
  target_strategy: aggregate_lis_to_obs
  resampling_method: conservative
period:
  start: '2015-01-01'
  end: '2020-12-31'
quality_control:
  minimum_valid_pairs: 30
  minimum_valid_fraction: 0.5
enabled: false
