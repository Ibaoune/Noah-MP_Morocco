dataset_id: copernicus_lai
display_name: Copernicus LAI
version: unknown
validation_category: vegetation
validation_role: INDEPENDENT_REMOTE_SENSING
independence_level: STRICT
paths:
  raw: data/validation/vegetation/Copernicus_LAI/raw
  processed: data/validation/vegetation/Copernicus_LAI/processed
files:
  pattern: '*_nc'
variables:
  observation: LAI
  lis: LAI_tavg
coordinates:
  time: time
  latitude: lat
  longitude: lon
units:
  native: m2/m2
  target: m2/m2
  scale_factor: 1.0
  offset: 0.0
missing_values:
  fill_value: -9999.0
  valid_min: null
  valid_max: null
temporal:
  native_frequency: daily
  target_frequency: daily
  interval_definition: mean
spatial:
  native_resolution: 0.25 deg
  target_strategy: aggregate_lis_to_obs
  resampling_method: conservative
period:
  start: '2015-01-01'
  end: '2020-12-31'
quality_control:
  minimum_valid_pairs: 30
  minimum_valid_fraction: 0.5
enabled: false
