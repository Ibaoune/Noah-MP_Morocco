dataset_id: gleam
display_name: GLEAM ET
version: unknown
validation_category: evapotranspiration
validation_role: MODEL_ASSISTED_REMOTE_SENSING_BENCHMARK
independence_level: STRICT
paths:
  raw: data/validation/evapotranspiration/GLEAM/raw
  processed: data/validation/evapotranspiration/GLEAM/processed
files:
  pattern: '*.nc'
variables:
  observation: E
  lis: Evap_tavg
coordinates:
  time: time
  latitude: lat
  longitude: lon
units:
  native: mm/day
  target: mm/day
  scale_factor: 1.0
  offset: 0.0
missing_values:
  fill_value: -9999.0
  valid_min: null
  valid_max: null
temporal:
  native_frequency: daily
  target_frequency: daily
  interval_definition: mean
spatial:
  native_resolution: 0.25 deg
  target_strategy: aggregate_lis_to_obs
  resampling_method: conservative
period:
  start: '2015-01-01'
  end: '2020-12-31'
quality_control:
  minimum_valid_pairs: 30
  minimum_valid_fraction: 0.5
enabled: true
