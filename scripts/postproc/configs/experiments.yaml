# ============================================================
# CATALOGUE DES EXPÉRIENCES — Framework LIS/Noah-MP
# ============================================================
# Ce fichier référence TOUTES les expériences disponibles.
# Les chemins (path) sont résolus depuis paths.project_root défini dans global.yaml.
#
# Pour ajouter une nouvelle expérience :
#   1. Créer une nouvelle clé sous "experiments:"
#   2. Remplir tous les champs (label, type, year, path, etc.)
#   3. Référencer la clé dans une recette configs/recipes/*.yaml
#
# Règle : path: null = expérience déclarée mais pas encore disponible.

experiments:

  OPL:
    label: OPL
    type: open_loop
    period: "2016-2020"
    assimilation: none
    cdf_matching: false
    irrigation: false
    domain: NorthMor
    matrix: matrix_2016_2020
    path: experiments/NorthMor/matrix_2016_2020/OPL_noirr_2016_2020/output
    color: "#2166AC"
    linestyle: "-"
    marker: "o"

  DA_NoCDF:
    label: DA-NoCDF
    type: data_assimilation
    period: "2016-2020"
    assimilation: SMAP
    cdf_matching: false
    irrigation: false
    domain: NorthMor
    matrix: matrix_2016_2020
    path: experiments/NorthMor/matrix_2016_2020/DA_nocdf_noirr_2016_2020/output
    color: "#D6604D"
    linestyle: "--"
    marker: "s"

  DA_CDF:
    label: DA-CDF
    type: data_assimilation
    period: "2016-2020"
    assimilation: SMAP
    cdf_matching: true
    irrigation: false
    domain: NorthMor
    matrix: matrix_2016_2020
    path: experiments/NorthMor/matrix_2016_2020/DA_cdf_noirr_2016_2020/output
    color: "#B2182B"
    linestyle: "-."
    marker: "^"

  # ----------------------------------------------------------
  # Expériences futures (LAI, Joint, etc.) - path à définir
  # ----------------------------------------------------------
  DA_lai_noirr_2016:
    label: "DA-LAI"
    type: data_assimilation
    year: 2016
    assimilation: LAI
    cdf_matching: true
    irrigation: false
    domain: NorthMor
    matrix: matrix_2016
    path: null
    color: "#4DAC26"
    linestyle: ":"
    marker: "D"

  DA_joint_smap_lai_noirr_2016:
    label: "DA-SMAP-LAI"
    type: data_assimilation
    year: 2016
    assimilation: SMAP+LAI
    cdf_matching: true
    irrigation: false
    domain: NorthMor
    matrix: matrix_2016
    path: null
    color: "#762A83"
    linestyle: "-"
    marker: "v"
